<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
<header style="height:64px;box-sizing:border-box;background:#FAFAFA;border-bottom:1px solid rgba(10,10,10,.14);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px">
  <nav aria-label="Migas" style="display:flex;align-items:center;gap:8px;font-size:14px;color:#666666">
    <span>Invent</span>
    <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="1">
      <span style="display:flex;gap:8px;align-items:center"><span aria-hidden="true">/</span><span style="color:{{ c.color }};font-weight:{{ c.w }}">{{ c.t }}</span></span>
    </sc-for>
  </nav>
  <div style="display:flex;align-items:center;gap:16px">
    <label style="position:relative;display:block"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ciudad</span><select data-testid="city-picker" value="{{ city }}" onChange="{{ onCity }}" style="appearance:none;height:36px;box-sizing:border-box;padding:0 32px 0 12px;border:1px solid #767676;border-radius:8px;background:#FAFAFA;color:#0A0A0A;font-family:inherit;font-size:14px;cursor:pointer"><sc-for list="{{ cities }}" as="c" hint-placeholder-count="5"><option value="{{ c.v }}">{{ c.l }}</option></sc-for></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3D3D3D" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;right:10px;top:11px;pointer-events:none"><path d="m6 9 6 6 6-6"></path></svg></label>
    <span style="font-size:13px;color:#666666">Invent · Colombia</span>
    <div data-testid="whoami" style="display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid rgba(10,10,10,.14)">
      <span aria-hidden="true" style="width:32px;height:32px;border-radius:50%;background:#0A0A0A;color:#FAFAFA;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:.04em">{{ initials }}</span>
      <span style="display:flex;flex-direction:column;line-height:16px"><span style="font-size:13px;color:#3D3D3D">{{ who }}</span><span style="font-size:12px;color:#666666">{{ role }} · {{ scope }}</span></span>
      <sc-if value="{{ isLocal }}" hint-placeholder-val="{{ false }}"><span data-testid="local-mode" title="La pasarela no valida identidad: no hay sesión y se ven todas las secciones como admin." style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#FFF8EB;border:1px solid #FCDDA0;font-size:12px;font-weight:500;color:#A1460A;white-space:nowrap">Modo local (sin sesión)</span></sc-if>
    </div>
    <button data-testid="theme-toggle" onClick="{{ onThemeFn }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" aria-pressed="{{ isDark }}" style="width:36px;height:36px;flex:none;border:1px solid rgba(10,10,10,.26);border-radius:999px;background:transparent;color:#0A0A0A;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap" style-hover="background:#F5F5F5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ themeIcon }}"></path></svg></button><button data-testid="logout" onClick="{{ onLogout }}" style="height:36px;padding:0 16px;border:1px solid rgba(10,10,10,.26);border-radius:999px;background:transparent;color:#0A0A0A;font-family:inherit;font-size:13px;font-weight:500;letter-spacing:.02em;cursor:pointer;white-space:nowrap" style-hover="background:#F5F5F5">{{ logoutLabel }}</button>
  </div>
</header>
</sc-if>
<sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
<header style="height:64px;box-sizing:border-box;background:#FAFAFA;border-bottom:1px solid rgba(10,10,10,.14);display:flex;align-items:center;justify-content:space-between;padding:0 16px">
  <div style="display:flex;align-items:center;gap:12px">
    <button aria-label="Abrir menú" onClick="{{ onMenu }}" style="width:44px;height:44px;border:1px solid rgba(10,10,10,.26);border-radius:999px;background:transparent;display:flex;align-items:center;justify-content:center;color:#0A0A0A;white-space:nowrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
    <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="34" width="28" height="58" rx="14" fill="#0A0A0A"></rect><circle cx="70" cy="23" r="12" fill="#0A0A0A"></circle></svg>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <select data-testid="city-picker" aria-label="Ciudad" value="{{ city }}" onChange="{{ onCity }}" style="appearance:none;height:36px;max-width:96px;padding:0 8px;border:1px solid #767676;border-radius:8px;background:#FAFAFA;color:#0A0A0A;font-family:inherit;font-size:12px"><sc-for list="{{ cities }}" as="c" hint-placeholder-count="5"><option value="{{ c.v }}">{{ c.l }}</option></sc-for></select>
    <div data-testid="whoami" title="{{ who }} · {{ role }}" style="display:flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:32px;height:32px;border-radius:50%;background:#0A0A0A;color:#FAFAFA;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500">{{ initials }}</span><sc-if value="{{ isLocal }}" hint-placeholder-val="{{ false }}"><span data-testid="local-mode" style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:#FFF8EB;border:1px solid #FCDDA0;font-size:11px;font-weight:500;color:#A1460A;white-space:nowrap">Local</span></sc-if></div>
    <button data-testid="theme-toggle" onClick="{{ onThemeFn }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" aria-pressed="{{ isDark }}" style="width:36px;height:36px;flex:none;border:1px solid rgba(10,10,10,.26);border-radius:999px;background:transparent;color:#0A0A0A;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap" style-hover="background:#F5F5F5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ themeIcon }}"></path></svg></button><button data-testid="logout" onClick="{{ onLogout }}" style="height:36px;padding:0 12px;border:1px solid rgba(10,10,10,.26);border-radius:999px;background:transparent;color:#0A0A0A;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap">{{ logoutLabel }}</button>
  </div>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const parts = (this.props.crumb || 'Mercado').split('|');
    const dk = this.props.theme === 'dark';
    return {
      isDark: dk, themeLabel: dk ? 'Usar tema claro' : 'Usar tema oscuro', themeIcon: dk ? 'M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z', onThemeFn: () => this.props.onTheme && this.props.onTheme(),
      desktop: !this.props.compact,
      compact: !!this.props.compact,
      role: this.props.role || '', scope: this.props.scope || '', who: this.props.who || '', initials: this.props.initials || '··', isLocal: !!this.props.local, logoutLabel: this.props.local ? 'Iniciar sesión' : 'Salir',
      // Values are the canonical city names core stores (libs/domain/cities.py); '' means all.
      city: this.props.city || '', onCity: e => this.props.onCity && this.props.onCity(e.target.value), onLogout: () => this.props.onLogout && this.props.onLogout(), cities: [['', 'Todas las ciudades'], ['Medellin', 'Medellín'], ['Bogota', 'Bogotá'], ['Cali', 'Cali'], ['Barranquilla', 'Barranquilla'], ['Cartagena', 'Cartagena']].map(([v, l]) => ({ v, l })),
      crumbs: parts.map((t, i) => ({ t, color: i === parts.length - 1 ? '#0A0A0A' : '#666666', w: i === parts.length - 1 ? 500 : 400 }))
    };
  }
}
</script>
</body>
</html>
