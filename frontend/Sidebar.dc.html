<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:{{ w }};height:100%;min-height:100%;max-height:100vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;background:#0A0A0A;color:#C9C8C4;display:flex;flex-direction:column;padding:20px 0 20px">
  <button type="button" onClick="{{ toggle }}" aria-label="{{ togLabel }}" aria-expanded="{{ expanded }}" title="{{ togLabel }}" style="display:flex;align-items:center;gap:10px;padding:0 {{ padX }};margin:0 0 32px;min-height:40px;justify-content:{{ jc }};border:0;background:transparent;color:inherit;font-family:inherit;text-align:left;cursor:pointer;width:100%;box-sizing:border-box" style-hover="background:#141414" style-focus="outline:2px solid #00D4FF;outline-offset:-2px">
    <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="34" width="28" height="58" rx="14" fill="#00D4FF"></rect><circle cx="70" cy="23" r="12" fill="#00D4FF"></circle></svg>
    <div style="display:{{ txt }}">
      <div style="font-size:16px;line-height:18px;font-weight:500;letter-spacing:-.02em;color:#FAFAFA">INVENT®</div>
      <div style="font-size:11px;line-height:16px;font-weight:500;letter-spacing:.16em;color:#8E8D89;margin-top:2px">MARKET TRACKER</div>
    </div>
  </button>
  <div style="font-size:11px;line-height:16px;font-weight:500;letter-spacing:.16em;color:#8E8D89;padding:0 24px 8px;display:{{ txt }}">OPERACIÓN</div>
  <nav style="display:flex;flex-direction:column;gap:2px;margin-bottom:24px">
    <sc-for list="{{ ops }}" as="it" hint-placeholder-count="4">
      <a href="#" onClick="{{ it.go }}" data-testid="{{ it.tid }}" style="display:flex;align-items:center;height:40px;padding:0 {{ itemPadR }} 0 {{ itemPadL }};justify-content:{{ jc }};border-left:3px solid {{ it.bar }};background:{{ it.bg }};color:{{ it.color }};font-size:14px;font-weight:500;text-decoration:none" title="{{ it.l }}" style-hover="background:#1C1C1C;color:#FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.ic }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ it.icon }}"></path></svg><span style="display:{{ txt }};margin-left:12px">{{ it.l }}</span></a>
    </sc-for>
  </nav>
  <sc-if value="{{ hasAna }}" hint-placeholder-val="{{ false }}">
  <div style="font-size:11px;line-height:16px;font-weight:500;letter-spacing:.16em;color:#8E8D89;padding:0 24px 8px;display:{{ txt }}">ANÁLISIS</div>
  <nav style="display:flex;flex-direction:column;gap:2px;margin-bottom:24px">
    <sc-for list="{{ ana }}" as="it" hint-placeholder-count="7">
      <a href="#" onClick="{{ it.go }}" data-testid="{{ it.tid }}" style="display:flex;align-items:center;height:40px;padding:0 {{ itemPadR }} 0 {{ itemPadL }};justify-content:{{ jc }};border-left:3px solid {{ it.bar }};background:{{ it.bg }};color:{{ it.color }};font-size:14px;font-weight:500;text-decoration:none" title="{{ it.l }}" style-hover="background:#1C1C1C;color:#FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.ic }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ it.icon }}"></path></svg><span style="display:{{ txt }};margin-left:12px">{{ it.l }}</span></a>
    </sc-for>
  </nav>
  </sc-if>
  <div style="font-size:11px;line-height:16px;font-weight:500;letter-spacing:.16em;color:#8E8D89;padding:0 24px 8px;display:{{ txt }}">SISTEMA</div>
  <nav style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ sys }}" as="it" hint-placeholder-count="2">
      <a href="#" onClick="{{ it.go }}" data-testid="{{ it.tid }}" style="display:flex;align-items:center;height:40px;padding:0 {{ itemPadR }} 0 {{ itemPadL }};justify-content:{{ jc }};border-left:3px solid {{ it.bar }};background:{{ it.bg }};color:{{ it.color }};font-size:14px;font-weight:500;text-decoration:none" title="{{ it.l }}" style-hover="background:#1C1C1C;color:#FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ it.ic }}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{ it.icon }}"></path></svg><span style="display:{{ txt }};margin-left:12px">{{ it.l }}</span></a>
    </sc-for>
  </nav>
  <div style="flex:1"></div>
  <div style="padding:0 {{ padX }};display:flex;flex-direction:column;gap:8px;align-items:{{ jc }}">
    <div data-testid="env-badge" style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:24px;padding:0 10px;border:1px solid rgba(250,250,250,.26);border-radius:999px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#FAFAFA;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:#00D4FF"></span>prod</div>
    <div style="display:{{ txt }};font-size:12px;line-height:16px;letter-spacing:.02em;color:#8E8D89">( MDE · 6.2442° N )</div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'market';
    const go = k => e => { e.preventDefault(); this.props.onNav && this.props.onNav(k); };
    const c = !!this.props.collapsed;
    const IC = { market: 'M3 3v18h18M7 14l4-4 3 3 5-6', inbox: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z', leads: 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18ZM6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4', pipeline: 'M6 5v11M12 5v14M18 5v8', projects: 'M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z', territory: 'M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0ZM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6', ops: 'M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2', imports: 'M12 16V4M7 9l5-5 5 5M4 20h16', config: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', research: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3', analysis: 'M3 3v18h18M8 17V9M13 17V5M18 17v-6', analytics: 'M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z', 'st-analitica': 'M3 3v18h18M8 17V9M13 17V5M18 17v-6', 'st-modelos': 'M12 3a9 9 0 1 0 9 9M12 3v9l6 3', 'st-redes': 'M12 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM19 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM12 7v5M12 12l-6 5M12 12l6 5', 'st-segmentos': 'M21 12a9 9 0 1 1-9-9v9z', validation: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4', metrics: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', 'st-experimentos': 'M10 2v7.3L4.5 19a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9.3V2M8.5 2h7', rep: 'M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6' };
    const mk = it => ({ icon: IC[it.k] || IC.ops, ic: it.k === a ? '#00D4FF' : 'currentColor', go: go(it.k), l: it.l, tid: it.tid, color: it.k === a ? '#FFFFFF' : '#C9C8C4', bar: it.k === a ? '#00D4FF' : 'transparent', bg: it.k === a ? '#141414' : 'transparent' });
    const def = [{ k: 'market', l: 'Mercado', tid: 'nav-market', g: 'o' }, { k: 'leads', l: 'Leads', tid: 'nav-leads', g: 'o' }, { k: 'pipeline', l: 'Pipeline', tid: 'nav-pipeline', g: 'o' }, { k: 'projects', l: 'Proyectos', tid: 'nav-projects', g: 'o' }, { k: 'ops', l: 'Ops', tid: 'nav-ops', g: 's' }, { k: 'rep', l: 'Reportería ↗', tid: 'nav-reports', g: 's' }];
    const items = this.props.items || def;
    return { toggle: () => this.props.onToggle && this.props.onToggle(), togLabel: c ? 'Expandir barra lateral' : 'Contraer barra lateral', expanded: !c, w: c ? '72px' : '240px', padX: c ? '0px' : '24px', jc: c ? 'center' : 'flex-start', txt: c ? 'none' : 'block', itemPadL: c ? '0px' : '21px', itemPadR: c ? '0px' : '24px', ops: items.filter(x => x.g === 'o').map(mk), ana: items.filter(x => x.g === 'a').map(mk), hasAna: items.some(x => x.g === 'a'), sys: items.filter(x => x.g === 's').map(mk) };
  }
}
</script>
</body>
</html>
