<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;max-width:400px;box-sizing:border-box;background:#FAFAFA;border:1px solid rgba(10,10,10,.14);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px;font-family:Inter,sans-serif;color:#0A0A0A">
  <div style="display:flex;align-items:center;gap:10px"><svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect x="22" y="34" width="28" height="58" rx="14" fill="#0A0A0A"></rect><circle cx="70" cy="23" r="12" fill="#0A0A0A"></circle></svg><span style="font-size:16px;font-weight:500;letter-spacing:-.02em">INVENT®</span></div>
  <h2 style="margin:0;font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.02em">Entrar</h2>
  <sc-if value="{{ expired }}" hint-placeholder-val="{{ false }}"><div data-testid="login-session-expired" role="status" style="display:flex;gap:12px;padding:12px 16px;border-radius:12px;background:#E5F8FD;border:1px solid #9BE3F7;color:#006A99;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"></path></svg>Tu sesión se cerró. Vuelve a entrar.</div></sc-if>
  <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><div data-testid="login-error" role="alert" style="display:flex;gap:12px;padding:12px 16px;border-radius:12px;background:{{ eBg }};border:1px solid {{ eBd }};color:{{ eFg }};font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="{{ eIcon }}"></path></svg><div><div style="font-weight:500">{{ eMsg }}</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:2px">{{ eCode }}</div></div></div></sc-if>
  <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:#3D3D3D">Correo<input data-testid="login-email" type="email" value="usuario@invent.example" style="height:44px;box-sizing:border-box;padding:0 12px;border:1px solid {{ ib }};border-radius:8px;background:#FAFAFA;font-family:inherit;font-size:14px;color:#0A0A0A" style-focus="outline:2px solid #0A0A0A;outline-offset:2px"></label>
  <label style="display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:#3D3D3D">Contraseña<input data-testid="login-password" type="password" value="contraseña" style="height:44px;box-sizing:border-box;padding:0 12px;border:1px solid {{ ib }};border-radius:8px;background:#FAFAFA;font-family:inherit;font-size:14px;color:#0A0A0A" style-focus="outline:2px solid #0A0A0A;outline-offset:2px"></label>
  <button data-testid="login-submit" onClick="{{ submit }}" disabled="{{ off }}" style="height:44px;border:1px solid {{ bb }};border-radius:999px;background:{{ bbg }};color:{{ bfg }};font-family:inherit;font-size:13px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap" style-focus="outline:2px solid #0A0A0A;outline-offset:2px"><sc-if value="{{ sending }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"></path></svg></sc-if>{{ label }}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:520},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;error&quot;,&quot;locked&quot;,&quot;sending&quot;,&quot;expired&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'default';
    const OCT = 'M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86zM12 8v4M12 16h.01';
    const TRI = 'm21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01';
    const submit = e => { const r = e.currentTarget.parentNode; this.props.onSubmit && this.props.onSubmit(r.querySelector('[data-testid=login-email]').value, r.querySelector('[data-testid=login-password]').value); };
    const bad = s === 'error', lock = s === 'locked', send = s === 'sending';
    return {
      submit, expired: s === 'expired', err: bad || lock, sending: send,
      eBg: bad ? '#FEF3F2' : '#FFF8EB', eBd: bad ? '#FECDCA' : '#FCDDA0', eFg: bad ? '#B42318' : '#A1460A', eIcon: bad ? OCT : TRI,
      eMsg: bad ? 'Correo o contraseña incorrectos.' : 'Demasiados intentos. Espera 5 minutos.', eCode: bad ? 'AUTH_INVALID' : 'AUTH_RATE_LIMITED',
      ib: bad ? '#D92D20' : '#767676', off: send || lock,
      label: send ? 'Enviando…' : 'Entrar',
      bb: lock ? 'rgba(10,10,10,.14)' : '#0A0A0A', bbg: lock ? '#F5F5F5' : '#0A0A0A', bfg: lock ? '#666666' : '#FAFAFA'
    };
  }
}
</script>
</body>
</html>
