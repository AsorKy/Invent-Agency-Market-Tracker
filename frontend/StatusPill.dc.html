<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;box-sizing:border-box;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;background:{{ bg }};color:{{ fg }};border:1px solid {{ bd }}"><sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ icon }}"></path></svg></sc-if>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const H = 'rgba(10,10,10,.14)';
    const FLAME = 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z';
    const BAN = 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM4.9 4.9l14.2 14.2';
    const M = {
      descubierto: ['Descubierto', '#F5F5F5', '#3D3D3D', H, ''],
      calificado: ['Calificado', '#E5F8FD', '#006A99', '#9BE3F7', ''],
      hot: ['Hot', '#FFF8EB', '#A1460A', '#FCDDA0', FLAME],
      contactado: ['Contactado', '#F3EFFF', '#5B3DCB', '#F3EFFF', ''],
      reunion: ['Reunión', '#ECFAF3', '#067647', '#A9E9C9', ''],
      propuesta: ['Propuesta', '#0A0A0A', '#E9E8E4', '#0A0A0A', ''],
      ganado: ['Ganado', '#1F9A6E', '#FFFFFF', '#1F9A6E', ''],
      perdido: ['Perdido', '#F5F5F5', '#525252', H, BAN]
    };
    // API stages (core.lead.stage) map onto the design keys; 'new' is the legacy Hot.
    const API = { discovered: 'descubierto', qualified: 'calificado', new: 'hot', contacted: 'contactado', meeting: 'reunion', proposal: 'propuesta', won: 'ganado', lost: 'perdido' };
    const k = String(this.props.status || 'descubierto').toLowerCase();
    const m = M[API[k] || k] || M.descubierto;
    return { label: m[0], bg: m[1], fg: m[2], bd: m[3], icon: m[4], hasIcon: !!m[4] };
  }
}
</script>
</body>
</html>
