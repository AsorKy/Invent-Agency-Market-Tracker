# Google Maps (Bright Data dataset gd_m8ebnr0q2qlklc02fz, discover by location) to
# canonical company fields.
# unverified: field names come from the public Bright Data documentation; the phase 0
# probe got only a provider crawl_error record (D-13). Coordinates also read
# latitude/longitude, the website never falls back to the Google Maps url, and city keeps
# only a target city (from city or the address).
version: 2
source: maps
unverified: true
entity: company
signal_type: maps_listing
external_id: [place_id, cid, fid]
fields:
  name:
    from: [name, title]
    transform: strip
    required: true
  address:
    from: [address, full_address]
    transform: strip
  city:
    from: [city, address_city, address]
    transform: city
  category:
    from: [category, main_category]
    transform: lower
  phone:
    from: [phone_number, phone]
    transform: strip
  website:
    from: [open_website, website]
    transform: url
  rating:
    from: [rating]
    transform: float
  review_count:
    from: [reviews_count, review_count]
    transform: int
  lat:
    from: [lat, latitude, location.lat]
    transform: float
  lng:
    from: [lon, lng, longitude, location.lng]
    transform: float
