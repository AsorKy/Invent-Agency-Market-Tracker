# LinkedIn company profiles (Bright Data dataset gd_l1vikfnt1wgvvqz95w) to canonical
# company fields.
# Verified against tests/fixtures/brightdata/recorded/linkedin_companies.json (D-13).
# headquarters is free text ("Medellin, Antioquia", "Global"), so city keeps only a target
# city. The similar and affiliated arrays (companies: title, subtitle, Links) are carried
# whole into the signal payload; employees and updates (people) are dropped before landing.
# linkedin_company_id is the identity core shares with the job postings of the company.
version: 2
source: linkedin_companies
unverified: false
entity: company
signal_type: linkedin_company
external_id: [company_id, id, url]
fields:
  name:
    from: [name]
    transform: strip
    required: true
  linkedin_company_id:
    from: [company_id]
    transform: strip
  city:
    from: [headquarters, city]
    transform: city
  country_code:
    from: [country_code]
    transform: strip
  industry:
    from: [industries]
    transform: strip
  company_size:
    from: [company_size]
    transform: strip
  employee_count:
    from: [employees_in_linkedin]
    transform: int
  follower_count:
    from: [followers]
    transform: int
  website:
    from: [website]
    transform: url
  linkedin_url:
    from: [url]
    transform: url
  similar:
    from: [similar]
  affiliated:
    from: [affiliated]
