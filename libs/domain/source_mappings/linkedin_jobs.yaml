# LinkedIn job postings (Bright Data dataset gd_lpfll7v5hcqtkxl6l, discover by keyword,
# filtered to Colombia) to canonical job posting fields.
# Verified against tests/fixtures/brightdata/recorded/linkedin_jobs.json (D-13). The search
# keyword comes back in discovery_input; the dataset returns no job_base_pay_range, and
# base_salary was empty in every sample, so no salary field is mapped.
version: 2
source: linkedin_jobs
unverified: false
entity: job_posting
signal_type: job_posting
external_id: [job_posting_id, url]
fields:
  title:
    from: [job_title]
    transform: strip
    required: true
  company_name:
    from: [company_name]
    transform: strip
    required: true
  company_id:
    from: [company_id]
    transform: strip
  company_url:
    from: [company_url]
    transform: url
  city:
    from: [job_location]
    transform: city
  keyword:
    from: [discovery_input.keyword, input.discovery_input.keyword]
    transform: strip
  industry:
    from: [job_industries]
    transform: strip
  description:
    from: [job_summary]
    transform: strip
  seniority:
    from: [job_seniority_level]
    transform: strip
  employment_type:
    from: [job_employment_type]
    transform: strip
  posted_at:
    from: [job_posted_date]
    transform: strip
  url:
    from: [url, apply_link]
    transform: url
