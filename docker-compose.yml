# F0 local environment: Postgres, Redis, APIs, workers, mocks, and n8n.
# Relates to .env.example, deploy/Dockerfile.python, migrations/, ops/migrate.py,
# and the versioned workflows in orchestration/n8n; it contains no production
# secrets. Service catalog: SPEC section 3.1.
# Each database-backed service reads only its own <schema>_app role; the
# one-shot migrate service is the only place that applies migrations.
x-app-env: &app_env
  APP_VERSION: ${APP_VERSION:-dev}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
  REDIS_URL: redis://data:${REDIS_DATA_PASSWORD:-local-redis-data}@redis:6379/0
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-4}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-10}
  REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
  WORKER_RETRY_ATTEMPTS: ${WORKER_RETRY_ATTEMPTS:-3}
  WORKER_STREAM_BLOCK_MS: ${WORKER_STREAM_BLOCK_MS:-5000}
  WORKER_FAILURE_SLEEP_SECONDS: ${WORKER_FAILURE_SLEEP_SECONDS:-1}
  OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
  WORKER_RETRY_BASE_DELAY_SECONDS: ${WORKER_RETRY_BASE_DELAY_SECONDS:-1}
  WORKER_RETRY_MAX_DELAY_SECONDS: ${WORKER_RETRY_MAX_DELAY_SECONDS:-30}
  WORKER_RETRY_JITTER_RATIO: ${WORKER_RETRY_JITTER_RATIO:-0.25}
  INGEST_ENQUEUE_MARK_TTL_SECONDS: ${INGEST_ENQUEUE_MARK_TTL_SECONDS:-86400}
  SCORE_LOCK_TTL_SECONDS: ${SCORE_LOCK_TTL_SECONDS:-30}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
  BRIGHT_DATA_WEBHOOK_SECRET: ${BRIGHT_DATA_WEBHOOK_SECRET:-}
  BRIGHT_DATA_REPLAY_WINDOW_SECONDS: ${BRIGHT_DATA_REPLAY_WINDOW_SECONDS:-300}
  INGEST_TENANT_ID: ${INGEST_TENANT_ID:-00000000-0000-4000-8000-0000000000a1}
  INGEST_MODE: ${INGEST_MODE:-mock}
  INGEST_POLL_ENABLED: ${INGEST_POLL_ENABLED:-true}
  INGEST_POLL_INTERVAL_SECONDS: ${INGEST_POLL_INTERVAL_SECONDS:-300}
  SOURCE_MAPS_ENABLED: ${SOURCE_MAPS_ENABLED:-true}
  SOURCE_MAPS_DATASET_ID: ${SOURCE_MAPS_DATASET_ID:-}
  SOURCE_COMPUTRABAJO_ENABLED: ${SOURCE_COMPUTRABAJO_ENABLED:-true}
  SOURCE_COMPUTRABAJO_DATASET_ID: ${SOURCE_COMPUTRABAJO_DATASET_ID:-}
  SOURCE_LINKEDIN_COMPANIES_ENABLED: ${SOURCE_LINKEDIN_COMPANIES_ENABLED:-false}
  SOURCE_LINKEDIN_COMPANIES_DATASET_ID: ${SOURCE_LINKEDIN_COMPANIES_DATASET_ID:-}
  SOURCE_LINKEDIN_JOBS_ENABLED: ${SOURCE_LINKEDIN_JOBS_ENABLED:-false}
  SOURCE_LINKEDIN_JOBS_DATASET_ID: ${SOURCE_LINKEDIN_JOBS_DATASET_ID:-}
  SOURCE_INSTAGRAM_ENABLED: ${SOURCE_INSTAGRAM_ENABLED:-false}
  SOURCE_INSTAGRAM_DATASET_ID: ${SOURCE_INSTAGRAM_DATASET_ID:-}
  SOURCE_RUES_ENABLED: ${SOURCE_RUES_ENABLED:-false}
  SOURCE_RUES_DATASET_ID: ${SOURCE_RUES_DATASET_ID:-}
  BRIGHT_DATA_API_URL: ${BRIGHT_DATA_API_URL:-https://api.brightdata.com}
  BRIGHT_DATA_API_TOKEN: ${BRIGHT_DATA_API_TOKEN:-}
  PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
  HOT_LEAD_WEBHOOK_URL: ${HOT_LEAD_WEBHOOK_URL:-}
  SOCIO_DATA_DIR: ${SOCIO_DATA_DIR:-data/socio}
  APP_PROFILE: ${APP_PROFILE:-local}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  DEV_USER_PASSWORD_ADMIN: ${DEV_USER_PASSWORD_ADMIN:-}
  DEV_USER_PASSWORD_STRATEGIST: ${DEV_USER_PASSWORD_STRATEGIST:-}
  DEV_USER_PASSWORD_INTAKE: ${DEV_USER_PASSWORD_INTAKE:-}
  DEV_USER_PASSWORD_BD_REP: ${DEV_USER_PASSWORD_BD_REP:-}
  DEV_USER_PASSWORD_ANALYST: ${DEV_USER_PASSWORD_ANALYST:-}

services:
  postgres:
    # Built from deploy/Dockerfile.postgres: pgvector, PostGIS and pg_cron on top of
    # postgres:16. pg_cron must be preloaded and pinned to the application database.
    build:
      context: deploy
      dockerfile: Dockerfile.postgres
    image: invent-market-tracker-postgres:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-invent_market_tracker}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invent_market_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # ACL users edge (rate limits) and data (streams, locks); the default user is off.
    # The entrypoint renders the ACL file from deploy/redis/acl.rules and these passwords.
    image: redis:7-alpine
    entrypoint: ["sh", "/etc/redis-acl/entrypoint.sh"]
    environment:
      REDIS_EDGE_PASSWORD: ${REDIS_EDGE_PASSWORD:-local-redis-edge}
      REDIS_DATA_PASSWORD: ${REDIS_DATA_PASSWORD:-local-redis-data}
    volumes:
      - ./deploy/redis:/etc/redis-acl:ro
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user data --pass \"$$REDIS_DATA_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "ops.migrate"]
    environment:
      MIGRATE_DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-roles:
    # One-shot: creates/updates the <schema>_owner and <schema>_app roles and
    # grants after migrate (idempotent). It must run after migrate because the
    # grants cover the tables migrate creates. For the same reason migrate
    # cannot use a dedicated migrator role created here (circular), so it keeps
    # the postgres superuser; this service re-grants on every start.
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "ops/bootstrap_roles.py"]
    environment:
      BOOTSTRAP_DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
      BOOTSTRAP_PASSWORD_INGEST: ${BOOTSTRAP_PASSWORD_INGEST:-CHANGE_ME_INGEST}
      BOOTSTRAP_PASSWORD_CORE: ${BOOTSTRAP_PASSWORD_CORE:-CHANGE_ME_CORE}
      BOOTSTRAP_PASSWORD_ML: ${BOOTSTRAP_PASSWORD_ML:-CHANGE_ME_ML}
      BOOTSTRAP_PASSWORD_PULSE: ${BOOTSTRAP_PASSWORD_PULSE:-CHANGE_ME_PULSE}
      BOOTSTRAP_PASSWORD_BRIEF: ${BOOTSTRAP_PASSWORD_BRIEF:-CHANGE_ME_BRIEF}
      BOOTSTRAP_PASSWORD_IDENTITY: ${BOOTSTRAP_PASSWORD_IDENTITY:-CHANGE_ME_IDENTITY}
      BOOTSTRAP_PASSWORD_SOCIO: ${BOOTSTRAP_PASSWORD_SOCIO:-CHANGE_ME_SOCIO}
      APP_PROFILE: ${APP_PROFILE:-local}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.gateway.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
      GATEWAY_PORT: 8000
      APP_PROFILE: ${APP_PROFILE:-local}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      INGEST_URL: http://ingest:8000
      CORE_URL: http://core:8000
      ML_URL: http://ml:8000
      IDENTITY_URL: http://identity:8000
      PULSE_URL: http://pulse:8000
      BRIEF_URL: http://brief:8000
      STREAMLIT_URL: http://streamlit:8501
      REDIS_URL: redis://edge:${REDIS_EDGE_PASSWORD:-local-redis-edge}@redis:6379/0
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-10}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      UPSTREAM_RETRY_ATTEMPTS: ${UPSTREAM_RETRY_ATTEMPTS:-2}
      UPSTREAM_RETRY_BASE_DELAY_SECONDS: ${UPSTREAM_RETRY_BASE_DELAY_SECONDS:-0.1}
      UPSTREAM_RETRY_MAX_DELAY_SECONDS: ${UPSTREAM_RETRY_MAX_DELAY_SECONDS:-2}
      UPSTREAM_RETRY_JITTER_RATIO: ${UPSTREAM_RETRY_JITTER_RATIO:-0.2}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-10}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      EDGE_SECRET: ${EDGE_SECRET:-}
      EDGE_SECRET_REQUIRED: ${EDGE_SECRET_REQUIRED:-false}
      CSRF_REQUIRED: ${CSRF_REQUIRED:-false}
      IDENTITY_VALIDATION_ENABLED: ${IDENTITY_VALIDATION_ENABLED:-false}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      identity:
        condition: service_healthy
      ingest:
        condition: service_healthy
      core:
        condition: service_healthy
      pulse:
        condition: service_healthy
      brief:
        condition: service_healthy
      ml:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.ingest.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://ingest_app:${BOOTSTRAP_PASSWORD_INGEST:-CHANGE_ME_INGEST}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.core.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://core_app:${BOOTSTRAP_PASSWORD_CORE:-CHANGE_ME_CORE}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
      EVENT_CHAIN_EMIT: ${EVENT_CHAIN_EMIT:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.ml.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app_env
      CORE_URL: http://core:8000
      DATABASE_URL: "postgresql+asyncpg://ml_app:${BOOTSTRAP_PASSWORD_ML:-CHANGE_ME_ML}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
      EVENT_CHAIN_EMIT: ${EVENT_CHAIN_EMIT:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pulse:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.pulse.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://pulse_app:${BOOTSTRAP_PASSWORD_PULSE:-CHANGE_ME_PULSE}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  brief:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.brief.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://brief_app:${BOOTSTRAP_PASSWORD_BRIEF:-CHANGE_ME_BRIEF}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "services.identity.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      N8N_SOCIOECO_MINT_CREDENTIAL: ${N8N_SOCIOECO_MINT_CREDENTIAL:-}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-invent_market_tracker}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_app}
      IDENTITY_DB_PASSWORD: ${BOOTSTRAP_PASSWORD_IDENTITY:-CHANGE_ME_IDENTITY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command:
      - streamlit
      - run
      - services/streamlit/Home.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
      GATEWAY_URL: http://gateway:8000
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy

  core-relay:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "services.core.app.outbox_relay"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://core_app:${BOOTSTRAP_PASSWORD_CORE:-CHANGE_ME_CORE}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  core-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "services.core.app.worker"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://core_app:${BOOTSTRAP_PASSWORD_CORE:-CHANGE_ME_CORE}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingest-processor:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "services.ingest.app.processor"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://ingest_app:${BOOTSTRAP_PASSWORD_INGEST:-CHANGE_ME_INGEST}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pulse-consumer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "services.pulse.app.consumer"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://pulse_app:${BOOTSTRAP_PASSWORD_PULSE:-CHANGE_ME_PULSE}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ml-consumer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "services.ml.app.consumer"]
    environment:
      <<: *app_env
      DATABASE_URL: "postgresql+asyncpg://ml_app:${BOOTSTRAP_PASSWORD_ML:-CHANGE_ME_ML}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  drift-worker:
    # Optional nightly drift loop (REQ-LNS-007), outside the default stack: start it with
    # `docker compose --profile lens up -d drift-worker`. It reads series from pulse over HTTP
    # and posts alerts to DRIFT_ALERT_WEBHOOK_URL (empty means log only).
    profiles: ["lens"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "services.ml.app.schedule"]
    environment:
      <<: *app_env
      PULSE_URL: http://pulse:8000
      DRIFT_ALERT_WEBHOOK_URL: ${DRIFT_ALERT_WEBHOOK_URL:-}
      DRIFT_ALERT_HEADER_NAME: ${DRIFT_ALERT_HEADER_NAME:-}
      DRIFT_ALERT_HEADER_VALUE: ${DRIFT_ALERT_HEADER_VALUE:-}
      DRIFT_TENANT_ID: ${DRIFT_TENANT_ID:-}
      DRIFT_RUN_HOUR_UTC: ${DRIFT_RUN_HOUR_UTC:-7}
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-roles:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulse:
        condition: service_healthy
    restart: unless-stopped

  mocks:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["flask", "--app", "services.mocks.app.main:app", "run", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FLASK_APP: services.mocks.app.main:app

  n8n:
    image: n8nio/n8n:2.11.3
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-me-for-local-use}
      N8N_SECURE_COOKIE: "false"
      TZ: America/Bogota
      BRIGHT_DATA_API_URL: ${BRIGHT_DATA_API_URL:-https://api.brightdata.com}
      BRIGHT_DATA_API_TOKEN: ${BRIGHT_DATA_API_TOKEN:-}
      INGEST_WEBHOOK_URL: ${INGEST_WEBHOOK_URL:-http://gateway:8000/api/v1/ingest/webhook/bd}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-http://mocks:8000/mocks/telegram}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./orchestration/n8n:/home/node/workflows:ro
    depends_on:
      gateway:
        condition: service_started
      mocks:
        condition: service_started

  pgadmin:
    # Optional data UI (SQL editor, table browser) on http://localhost:${PGADMIN_PORT}; start it
    # with `make db-ui`. Desktop mode: no pgAdmin login, bound to loopback only. It connects as
    # the `postgres` superuser, so it also sees rows that row level security hides from the apps.
    # The database password is not stored here: pgAdmin asks for it on the first connection.
    image: dpage/pgadmin4:8.14
    profiles: ["ui"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-only}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./deploy/pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  pgadmin_data:

