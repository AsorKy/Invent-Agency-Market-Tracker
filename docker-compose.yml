# F0 local environment: Postgres, Redis, APIs, workers, mocks, and n8n.
# Relates to .env.example, deploy/Dockerfile.python, migrations/, and the
# versioned workflows in orchestration/n8n; it contains no production secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invent_market_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.gateway.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
      GATEWAY_PORT: 8000
      APP_PROFILE: ${APP_PROFILE:-local}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      INGEST_URL: http://ingest:8000
      CORE_URL: http://core:8000
      ANALYTICS_URL: http://analytics:8000
      ML_URL: http://ml:8000
      IDENTITY_URL: http://identity:8000
      PULSE_URL: http://pulse:8000
      BRIEF_URL: http://brief:8000
      STREAMLIT_URL: http://streamlit:8501
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-10}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      UPSTREAM_RETRY_ATTEMPTS: ${UPSTREAM_RETRY_ATTEMPTS:-2}
      UPSTREAM_RETRY_BASE_DELAY_SECONDS: ${UPSTREAM_RETRY_BASE_DELAY_SECONDS:-0.1}
      UPSTREAM_RETRY_MAX_DELAY_SECONDS: ${UPSTREAM_RETRY_MAX_DELAY_SECONDS:-2}
      UPSTREAM_RETRY_JITTER_RATIO: ${UPSTREAM_RETRY_JITTER_RATIO:-0.2}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-10}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      EDGE_SECRET: ${EDGE_SECRET:-}
      EDGE_SECRET_REQUIRED: ${EDGE_SECRET_REQUIRED:-false}
      CSRF_REQUIRED: ${CSRF_REQUIRED:-false}
      IDENTITY_VALIDATION_ENABLED: ${IDENTITY_VALIDATION_ENABLED:-false}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      identity:
        condition: service_started
      ingest:
        condition: service_started
      core:
        condition: service_started
      analytics:
        condition: service_started
      pulse:
        condition: service_started
      brief:
        condition: service_started
      ml:
        condition: service_started
      redis:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.ingest.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &service_environment
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invent_market_tracker}"
      REDIS_URL: redis://redis:6379/0
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-4}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-0}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-10}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      WORKER_RETRY_ATTEMPTS: ${WORKER_RETRY_ATTEMPTS:-3}
      WORKER_STREAM_BLOCK_MS: ${WORKER_STREAM_BLOCK_MS:-5000}
      WORKER_FAILURE_SLEEP_SECONDS: ${WORKER_FAILURE_SLEEP_SECONDS:-1}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      WORKER_RETRY_BASE_DELAY_SECONDS: ${WORKER_RETRY_BASE_DELAY_SECONDS:-1}
      WORKER_RETRY_MAX_DELAY_SECONDS: ${WORKER_RETRY_MAX_DELAY_SECONDS:-30}
      WORKER_RETRY_JITTER_RATIO: ${WORKER_RETRY_JITTER_RATIO:-0.25}
      INGEST_ENQUEUE_MARK_TTL_SECONDS: ${INGEST_ENQUEUE_MARK_TTL_SECONDS:-86400}
      SCORE_LOCK_TTL_SECONDS: ${SCORE_LOCK_TTL_SECONDS:-30}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}
      BRIGHT_DATA_WEBHOOK_SECRET: ${BRIGHT_DATA_WEBHOOK_SECRET:-}
      BRIGHT_DATA_REPLAY_WINDOW_SECONDS: ${BRIGHT_DATA_REPLAY_WINDOW_SECONDS:-300}
      INGEST_MODE: ${INGEST_MODE:-mock}
      INGEST_POLL_ENABLED: ${INGEST_POLL_ENABLED:-true}
      INGEST_POLL_INTERVAL_SECONDS: ${INGEST_POLL_INTERVAL_SECONDS:-300}
      SOURCE_MAPS_ENABLED: ${SOURCE_MAPS_ENABLED:-true}
      SOURCE_MAPS_DATASET_ID: ${SOURCE_MAPS_DATASET_ID:-}
      SOURCE_COMPUTRABAJO_ENABLED: ${SOURCE_COMPUTRABAJO_ENABLED:-true}
      SOURCE_COMPUTRABAJO_DATASET_ID: ${SOURCE_COMPUTRABAJO_DATASET_ID:-}
      SOURCE_LINKEDIN_COMPANIES_ENABLED: ${SOURCE_LINKEDIN_COMPANIES_ENABLED:-false}
      SOURCE_LINKEDIN_COMPANIES_DATASET_ID: ${SOURCE_LINKEDIN_COMPANIES_DATASET_ID:-}
      SOURCE_LINKEDIN_JOBS_ENABLED: ${SOURCE_LINKEDIN_JOBS_ENABLED:-false}
      SOURCE_LINKEDIN_JOBS_DATASET_ID: ${SOURCE_LINKEDIN_JOBS_DATASET_ID:-}
      SOURCE_INSTAGRAM_ENABLED: ${SOURCE_INSTAGRAM_ENABLED:-false}
      SOURCE_INSTAGRAM_DATASET_ID: ${SOURCE_INSTAGRAM_DATASET_ID:-}
      SOURCE_RUES_ENABLED: ${SOURCE_RUES_ENABLED:-false}
      SOURCE_RUES_DATASET_ID: ${SOURCE_RUES_DATASET_ID:-}
      BRIGHT_DATA_API_URL: ${BRIGHT_DATA_API_URL:-https://api.brightdata.com}
      BRIGHT_DATA_API_TOKEN: ${BRIGHT_DATA_API_TOKEN:-}
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL:-}
      HOT_LEAD_WEBHOOK_URL: ${HOT_LEAD_WEBHOOK_URL:-}
      SOCIO_DATA_DIR: ${SOCIO_DATA_DIR:-data/socio}
      APP_PROFILE: ${APP_PROFILE:-local}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DEV_USER_PASSWORD_ADMIN: ${DEV_USER_PASSWORD_ADMIN:-}
      DEV_USER_PASSWORD_STRATEGIST: ${DEV_USER_PASSWORD_STRATEGIST:-}
      DEV_USER_PASSWORD_INTAKE: ${DEV_USER_PASSWORD_INTAKE:-}
      DEV_USER_PASSWORD_BD_REP: ${DEV_USER_PASSWORD_BD_REP:-}
      DEV_USER_PASSWORD_ANALYST: ${DEV_USER_PASSWORD_ANALYST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.core.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.analytics.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.ml.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.identity.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-development-token}

  pulse:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.pulse.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  brief:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["uvicorn", "services.brief.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    # Temporary reporting shell. The Streamlit runtime is introduced with the
    # reporting dependency; this keeps the v2.2 service topology bootable now.
    command: ["uvicorn", "services.streamlit.app.main:app", "--host", "0.0.0.0", "--port", "8501"]
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ${SERVICE_NAME:-invent-market-tracker}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

  core-relay:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "services.core.app.outbox_relay"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  core-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "services.core.app.worker"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest-processor:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "services.ingest.app.processor"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-consumer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "services.analytics.app.consumer"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-consumer:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["python", "-m", "services.ml.app.consumer"]
    environment: *service_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mocks:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    command: ["flask", "--app", "services.mocks.app.main:app", "run", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      FLASK_APP: services.mocks.app.main:app

  n8n:
    image: n8nio/n8n:2.11.3
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-me-for-local-use}
      N8N_SECURE_COOKIE: "false"
      TZ: America/Bogota
      BRIGHT_DATA_API_URL: ${BRIGHT_DATA_API_URL:-https://api.brightdata.com}
      BRIGHT_DATA_API_TOKEN: ${BRIGHT_DATA_API_TOKEN:-}
      INGEST_WEBHOOK_URL: ${INGEST_WEBHOOK_URL:-http://gateway:8000/api/v1/ingest/webhook/bd}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-http://mocks:8000/mocks/telegram}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./orchestration/n8n:/home/node/workflows:ro
    depends_on:
      gateway:
        condition: service_started
      mocks:
        condition: service_started

volumes:
  postgres_data:
  n8n_data:

