# Nightly verified encrypted backups: dump per schema, restore check in an
# ephemeral Postgres, age encryption, upload of the encrypted files only.
name: backups

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Check backup secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Report whether the four backup secrets exist (names only)
        env:
          HAS_PASSWORD: ${{ secrets.BACKUP_EPHEMERAL_PASSWORD != '' }}
          HAS_SOURCE: ${{ secrets.BACKUP_SOURCE_URL != '' }}
          HAS_ADMIN: ${{ secrets.BACKUP_EPHEMERAL_ADMIN_URL != '' }}
          HAS_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT != '' }}
        run: |
          if [ "$HAS_PASSWORD $HAS_SOURCE $HAS_ADMIN $HAS_RECIPIENT" = "true true true true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=backups disabled::backups disabled: secrets missing (BACKUP_EPHEMERAL_PASSWORD, BACKUP_SOURCE_URL, BACKUP_EPHEMERAL_ADMIN_URL, BACKUP_AGE_RECIPIENT)"
            echo "backups disabled: secrets missing" >> "$GITHUB_STEP_SUMMARY"
          fi

  backup:
    name: Verified encrypted backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate]
    if: needs.gate.outputs.enabled == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.BACKUP_EPHEMERAL_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BACKUP_SOURCE_URL: ${{ secrets.BACKUP_SOURCE_URL }}
      BACKUP_EPHEMERAL_ADMIN_URL: ${{ secrets.BACKUP_EPHEMERAL_ADMIN_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client age
      - name: Select retention
        id: retention
        run: echo "days=$(python -m ops.backups.backup --retention-days)" >> "$GITHUB_OUTPUT"
      - name: Dump, verify restore, encrypt
        run: python -m ops.backups.backup --output "$RUNNER_TEMP/backups-age" --work-dir "$RUNNER_TEMP/backups-work"
      - name: Check only encrypted files are uploaded
        run: python -m ops.backups.verify_restore "$RUNNER_TEMP"/backups-age/*.age
      - uses: actions/upload-artifact@v4
        with:
          name: backups-age
          path: ${{ runner.temp }}/backups-age/*.age
          retention-days: ${{ steps.retention.outputs.days }}
          if-no-files-found: error
