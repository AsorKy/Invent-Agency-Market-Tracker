# Validate Python syntax, script documentation, formatting, types, migrations,
# and n8n JSON. Relates to Makefile and the ops/ guardrails.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: static and migration guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python ops/check_migrations.py
      - run: python ops/check_restricted_assets.py
      - run: python ops/check_configuration.py
      - run: python ops/check_language.py
      - run: python ops/check_script_docs.py
      - run: python -m compileall -q libs services datagen ops
      - run: ruff check libs services datagen ops
      - run: ruff format --check libs services datagen ops
      - run: mypy libs services datagen ops

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: make test

  contracts:
    name: contracts and workflow JSON
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m json.tool orchestration/n8n/wf_maps_medellin.json >/dev/null
      - run: python -m json.tool orchestration/n8n/wf_hot_lead_alert.json >/dev/null

  # F0 placeholders for the remaining ARCH-0001 stages. Each becomes a real
  # blocking job when its dependency is introduced: integration,
  # contracts/OpenAPI diff, e2e, images, migrate, backend deploy, frontend
  # deploy and production smoke with rollback.
  pipeline-contract:
    name: F0 pipeline contract
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - run: test -f docker-compose.yml && test -f migrations/20261017_0001_expand_initial_schemas.sql

