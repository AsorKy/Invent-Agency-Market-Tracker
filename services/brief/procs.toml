# Brief processes for the v2.2 service shell. The API relates to app/main.py;
# its worker will consume invalidation events when the Brief schema is added.
[[proc]]
name = "api"
cmd = ["uvicorn", "services.brief.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
probe = "http://127.0.0.1:8000/health"
