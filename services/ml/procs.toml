# ML service processes for an ARCH-0001-compatible supervisor. Relates to
# app/main.py and app/consumer.py; the consumer runs with the API when score
# invalidation is deployed.
[[proc]]
name = "api"
cmd = ["uvicorn", "services.ml.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
probe = "http://127.0.0.1:8000/health"

[[proc]]
name = "consumer"
cmd = ["python", "-m", "services.ml.app.consumer"]
heartbeat = "/tmp/hb/consumer"

