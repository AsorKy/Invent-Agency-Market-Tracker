[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invent-market-tracker"
version = "0.1.0"
description = "Colombia-first ERP-lite and market analytics platform for Invent"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "flask>=3.1,<4",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "starlette>=0.40,<1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
analytics = [
  "dbt-postgres>=1.8,<2",
  "duckdb>=1.1,<2",
  "polars>=1.17,<2",
]
ml = [
  "hdbscan>=0.8,<1",
  "scikit-learn>=1.5,<2",
  "umap-learn>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["datagen*", "libs*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["transform/", "notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "(^transform/|^notebooks/)"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs real services (Postgres, Redis); run with make test-integration",
]
